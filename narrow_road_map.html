<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>狭道・私道 共有マップ</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; background: #f5f4f0; font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif; }

    #app { display: flex; flex-direction: column; height: 100svh; min-height: 500px; }

    /* Toolbar */
    #toolbar {
      background: #fff;
      border-bottom: 1px solid #e5e3dd;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 1000;
      overflow-x: auto;
      scrollbar-width: none;
    }
    #toolbar::-webkit-scrollbar { display: none; }
    .tool-title {
      font-size: 13px;
      font-weight: 600;
      color: #2c2c2a;
      white-space: nowrap;
      margin-right: 4px;
    }
    .tool-btn {
      border: 1px solid #d3d1c7;
      background: #fff;
      color: #5f5e5a;
      font-size: 13px;
      min-width: 48px;
      min-height: 48px;
      padding: 6px 10px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      white-space: nowrap;
      flex-shrink: 0;
      line-height: 1.2;
      transition: background 0.12s, border-color 0.12s;
    }
    .tool-btn:active { transform: scale(0.95); }
    .tool-btn .icon { font-size: 20px; }
    .tool-btn .label { font-size: 10px; }
    .tool-btn.active-red  { background: #faece7; border-color: #f0997b; color: #993c1d; }
    .tool-btn.active-blue { background: #e6f1fb; border-color: #85b7eb; color: #185fa5; }
    .tool-btn.active-amber{ background: #faeeda; border-color: #fac775; color: #854f0b; }
    .tool-btn.active-del  { background: #faece7; border-color: #f0997b; color: #993c1d; }

    /* Status bar */
    #status-bar {
      font-size: 12px;
      color: #888780;
      padding: 5px 12px;
      background: #f1efe8;
      border-bottom: 1px solid #e5e3dd;
      min-height: 26px;
      line-height: 1.4;
    }

    /* Map area */
    #map-wrap { flex: 1; position: relative; }
    #map { width: 100%; height: 100%; }

    /* FAB confirm button */
    #fab-confirm {
      position: absolute;
      bottom: 88px;
      right: 14px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #3b6d11;
      border: none;
      color: #c0dd97;
      font-size: 26px;
      cursor: pointer;
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 10px rgba(0,0,0,0.22);
    }
    #fab-confirm.show { display: flex; }
    #fab-confirm:active { transform: scale(0.93); }

    /* Legend */
    #legend {
      position: absolute;
      bottom: 14px;
      left: 14px;
      background: rgba(255,255,255,0.92);
      border: 1px solid #e5e3dd;
      border-radius: 10px;
      padding: 8px 12px;
      z-index: 1500;
      font-size: 11px;
      color: #888780;
      backdrop-filter: blur(4px);
    }
    #legend div { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
    .legend-line { width: 20px; height: 4px; border-radius: 2px; }

    /* Bottom sheet */
    #bottom-sheet {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: #fff;
      border-top: 1px solid #e5e3dd;
      border-radius: 18px 18px 0 0;
      padding: 14px 16px 36px;
      z-index: 3000;
      transform: translateY(100%);
      transition: transform 0.25s ease;
    }
    #bottom-sheet.open { transform: translateY(0); }
    #sheet-handle {
      width: 36px; height: 4px;
      background: #d3d1c7;
      border-radius: 2px;
      margin: 0 auto 14px;
    }
    #sheet-title { font-size: 14px; font-weight: 600; color: #2c2c2a; margin-bottom: 10px; }
    #sheet-text {
      width: 100%; height: 110px;
      font-size: 12px;
      border: 1px solid #d3d1c7;
      border-radius: 10px;
      padding: 8px;
      resize: none;
      font-family: 'Menlo', 'Courier New', monospace;
      background: #f8f7f4;
      color: #2c2c2a;
    }
    .sheet-btns { display: flex; gap: 8px; margin-top: 10px; }
    .sheet-btn {
      flex: 1; padding: 13px;
      font-size: 14px;
      border-radius: 10px;
      cursor: pointer;
      border: 1px solid #d3d1c7;
      background: #fff;
      color: #2c2c2a;
    }
    .sheet-btn:active { transform: scale(0.97); }
    .sheet-btn-primary {
      background: #185fa5;
      color: #fff;
      border-color: #185fa5;
      font-weight: 600;
    }

    /* Leaflet zoom control position tweak */
    .leaflet-top.leaflet-right { top: 10px; right: 10px; }
  </style>
</head>
<body>
<div id="app">
  <div id="toolbar">
    <span class="tool-title">⚠ 狭道マップ</span>
    <button class="tool-btn" id="btn-narrow" onclick="setMode('narrow')">
      <span class="icon">🔴</span><span class="label">狭い道</span>
    </button>
    <button class="tool-btn" id="btn-caution" onclick="setMode('caution')">
      <span class="icon">🔵</span><span class="label">注意道路</span>
    </button>
    <button class="tool-btn" id="btn-pin" onclick="setMode('pin')">
      <span class="icon">📍</span><span class="label">ピン</span>
    </button>
    <button class="tool-btn" id="btn-delete" onclick="setMode('delete')">
      <span class="icon">🗑</span><span class="label">削除</span>
    </button>
    <button class="tool-btn" onclick="undoLast()">
      <span class="icon">↩</span><span class="label">元に戻す</span>
    </button>
    <button class="tool-btn" onclick="openSheet('export')">
      <span class="icon">📤</span><span class="label">共有</span>
    </button>
    <button class="tool-btn" onclick="openSheet('import')">
      <span class="icon">📥</span><span class="label">読込</span>
    </button>
    <button class="tool-btn" onclick="gotoCurrentLocation()">
      <span class="icon">🎯</span><span class="label">現在地</span>
    </button>
  </div>

  <div id="status-bar">モードを選んでください</div>

  <div id="map-wrap">
    <div id="map"></div>
    <button id="fab-confirm" onclick="finishLine()">✓</button>
    <div id="legend">
      <div><span class="legend-line" style="background:#D85A30;"></span>狭い道</div>
      <div><span class="legend-line" style="background:#378ADD;height:2px;"></span>注意道路</div>
      <div><span style="font-size:14px;">📍</span> 注意ポイント</div>
    </div>
    <div id="bottom-sheet">
      <div id="sheet-handle"></div>
      <div id="sheet-title"></div>
      <textarea id="sheet-text" placeholder="ここにデータを貼り付け..."></textarea>
      <div class="sheet-btns">
        <button class="sheet-btn" onclick="closeSheet()">閉じる</button>
        <button class="sheet-btn sheet-btn-primary" id="sheet-action-btn" onclick="sheetAction()">実行</button>
      </div>
    </div>
  </div>
</div>

<script>
let map, mode = null, drawing = false, currentPoints = [], tempLine = null;
let allLayers = [], history = [], sheetMode = null;

function initMap() {
  map = L.map('map', {
    doubleClickZoom: false,
    tap: true,
    tapTolerance: 15,
    zoomControl: true,
  }).setView([35.1815, 136.9066], 15);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    maxZoom: 19,
  }).addTo(map);

  map.on('click', onMapClick);
  map.on('dblclick', onMapDblClick);

  const saved = tryLoad();
  if (saved && saved.length > 0) {
    loadData(saved);
    setStatus('保存データを読み込みました（' + saved.length + ' 件）');
  }
}

function setStatus(msg) {
  document.getElementById('status-bar').textContent = msg;
}

function setMode(m) {
  if (drawing) finishLine();
  mode = (mode === m) ? null : m;
  drawing = false;
  currentPoints = [];
  if (tempLine) { map.removeLayer(tempLine); tempLine = null; }
  document.getElementById('fab-confirm').classList.remove('show');

  const defs = [
    ['narrow',  'active-red'],
    ['caution', 'active-blue'],
    ['pin',     'active-amber'],
    ['delete',  'active-del'],
  ];
  defs.forEach(([id, cls]) => {
    document.getElementById('btn-' + id).className = 'tool-btn' + (mode === id ? ' ' + cls : '');
  });

  const msgs = {
    narrow:  '狭い道：タップで点を追加 → ✓ボタンで確定',
    caution: '注意道路：タップで点を追加 → ✓ボタンで確定',
    pin:     'タップして注意ポイントを追加',
    delete:  '削除したい線・ピンをタップ',
  };
  setStatus(mode ? msgs[mode] : 'モードを選んでください');
}

function onMapClick(e) {
  if (!mode) return;
  if (mode === 'pin') { addPin(e.latlng); return; }
  if (mode === 'delete') return;
  if (mode === 'narrow' || mode === 'caution') {
    drawing = true;
    currentPoints.push([e.latlng.lat, e.latlng.lng]);
    updateTempLine();
    document.getElementById('fab-confirm').classList.add('show');
    setStatus(currentPoints.length + ' 点追加済み — ✓ で確定');
  }
}

function onMapDblClick(e) {
  if (!drawing) return;
  currentPoints.push([e.latlng.lat, e.latlng.lng]);
  finishLine();
}

function updateTempLine() {
  if (tempLine) map.removeLayer(tempLine);
  if (currentPoints.length < 2) return;
  const color  = mode === 'narrow' ? '#D85A30' : '#378ADD';
  const weight = mode === 'narrow' ? 8 : 4;
  tempLine = L.polyline(currentPoints, { color, weight, opacity: 0.5, dashArray: '7,5' }).addTo(map);
}

function finishLine() {
  if (currentPoints.length < 2) {
    drawing = false; currentPoints = [];
    if (tempLine) { map.removeLayer(tempLine); tempLine = null; }
    document.getElementById('fab-confirm').classList.remove('show');
    setStatus('2点以上タップしてから確定してください');
    return;
  }
  if (tempLine) { map.removeLayer(tempLine); tempLine = null; }
  const color  = mode === 'narrow' ? '#D85A30' : '#378ADD';
  const weight = mode === 'narrow' ? 8 : 4;
  const type   = mode;
  const layer  = L.polyline(currentPoints, { color, weight, opacity: 0.85 });
  layer._mapData = { type, points: [...currentPoints] };
  layer.on('click', (ev) => {
    if (mode === 'delete') { removeLayer(layer); L.DomEvent.stopPropagation(ev); }
  });
  layer.addTo(map);
  allLayers.push(layer);
  history.push({ action: 'add', layer });
  saveData();
  drawing = false; currentPoints = [];
  document.getElementById('fab-confirm').classList.remove('show');
  setStatus('確定しました（合計 ' + allLayers.length + ' 件）');
}

function addPin(latlng) {
  const icon = L.divIcon({
    html: '<div style="font-size:28px;line-height:1;filter:drop-shadow(0 1px 3px rgba(0,0,0,0.35));">📍</div>',
    className: '',
    iconAnchor: [14, 28],
  });
  const layer = L.marker(latlng, { icon });
  layer._mapData = { type: 'pin', lat: latlng.lat, lng: latlng.lng };
  layer.on('click', (ev) => {
    if (mode === 'delete') { removeLayer(layer); L.DomEvent.stopPropagation(ev); }
  });
  layer.addTo(map);
  allLayers.push(layer);
  history.push({ action: 'add', layer });
  saveData();
  setStatus('ピンを追加しました（合計 ' + allLayers.length + ' 件）');
}

function removeLayer(layer) {
  map.removeLayer(layer);
  allLayers = allLayers.filter(l => l !== layer);
  history.push({ action: 'remove', layer });
  saveData();
  setStatus('削除しました（残り ' + allLayers.length + ' 件）');
}

function undoLast() {
  const last = history.pop();
  if (!last) { setStatus('元に戻す履歴がありません'); return; }
  if (last.action === 'add') {
    map.removeLayer(last.layer);
    allLayers = allLayers.filter(l => l !== last.layer);
  } else {
    last.layer.addTo(map);
    allLayers.push(last.layer);
  }
  saveData();
  setStatus('元に戻しました（' + allLayers.length + ' 件）');
}

function serializeAll() {
  return allLayers.map(l => l._mapData).filter(Boolean);
}

function loadData(data) {
  data.forEach(d => {
    if (d.type === 'narrow' || d.type === 'caution') {
      const color  = d.type === 'narrow' ? '#D85A30' : '#378ADD';
      const weight = d.type === 'narrow' ? 8 : 4;
      const layer  = L.polyline(d.points, { color, weight, opacity: 0.85 });
      layer._mapData = d;
      layer.on('click', (ev) => {
        if (mode === 'delete') { removeLayer(layer); L.DomEvent.stopPropagation(ev); }
      });
      layer.addTo(map);
      allLayers.push(layer);
    } else if (d.type === 'pin') {
      const icon = L.divIcon({
        html: '<div style="font-size:28px;line-height:1;">📍</div>',
        className: '',
        iconAnchor: [14, 28],
      });
      const layer = L.marker(L.latLng(d.lat, d.lng), { icon });
      layer._mapData = d;
      layer.on('click', (ev) => {
        if (mode === 'delete') { removeLayer(layer); L.DomEvent.stopPropagation(ev); }
      });
      layer.addTo(map);
      allLayers.push(layer);
    }
  });
}

function saveData() {
  try { localStorage.setItem('narrowRoadMap_v2', JSON.stringify(serializeAll())); } catch(e) {}
}

function tryLoad() {
  try {
    const s = localStorage.getItem('narrowRoadMap_v2');
    return s ? JSON.parse(s) : null;
  } catch(e) { return null; }
}

function openSheet(sm) {
  sheetMode = sm;
  document.getElementById('sheet-title').textContent =
    sm === 'export' ? '共有用データ（コピーして仲間に送る）' : '仲間のデータを読み込む';
  const ta = document.getElementById('sheet-text');
  ta.readOnly = (sm === 'export');
  ta.value    = (sm === 'export') ? JSON.stringify(serializeAll()) : '';
  document.getElementById('sheet-action-btn').textContent = sm === 'export' ? 'コピー' : '読み込む';
  document.getElementById('bottom-sheet').classList.add('open');
}

function closeSheet() {
  document.getElementById('bottom-sheet').classList.remove('open');
}

function sheetAction() {
  if (sheetMode === 'export') {
    const text = document.getElementById('sheet-text').value;
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text)
        .then(() => { setStatus('コピーしました！LINEなどで送ってください'); closeSheet(); })
        .catch(() => { setStatus('手動でテキストを長押しコピーしてください'); });
    } else {
      document.getElementById('sheet-text').select();
      document.execCommand('copy');
      setStatus('コピーしました！');
      closeSheet();
    }
  } else {
    try {
      const data = JSON.parse(document.getElementById('sheet-text').value);
      loadData(data);
      saveData();
      setStatus('読み込みました（合計 ' + allLayers.length + ' 件）');
      closeSheet();
    } catch(e) {
      setStatus('データの形式が正しくありません');
    }
  }
}

function gotoCurrentLocation() {
  if (!navigator.geolocation) { setStatus('現在地取得に非対応の環境です'); return; }
  setStatus('現在地を取得中...');
  navigator.geolocation.getCurrentPosition(
    pos => {
      const latlng = [pos.coords.latitude, pos.coords.longitude];
      map.setView(latlng, 17);
      L.circleMarker(latlng, {
        radius: 9,
        color: '#185FA5',
        fillColor: '#378ADD',
        fillOpacity: 0.9,
        weight: 2,
      }).addTo(map).bindPopup('現在地').openPopup();
      setStatus('現在地に移動しました');
    },
    () => setStatus('現在地の取得に失敗しました。位置情報の許可を確認してください')
  );
}

window.addEventListener('load', initMap);
</script>
</body>
</html>
