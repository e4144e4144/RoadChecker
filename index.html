<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>道路判定マップ</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans JP', sans-serif;
      height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
    }
    header {
      background: #fff; border-bottom: 1px solid #e0e0e0;
      padding: 10px 14px; flex-shrink: 0; z-index: 300;
    }
    .header-top { display: flex; align-items: center; margin-bottom: 8px; }
    .logo { font-size: 15px; font-weight: 700; color: #111; }
    .header-note { font-size: 10px; color: #bbb; margin-left: auto; }

    .search-row { display: flex; gap: 6px; }
    .search-wrapper { position: relative; flex: 1; min-width: 0; }
    .search-input {
      width: 100%; padding: 8px 12px; border-radius: 8px;
      border: 1px solid #d0d0d0; font-size: 13px;
      font-family: 'Noto Sans JP', sans-serif; outline: none; background: #f8f8f8;
    }
    .search-input:focus { border-color: #2563eb; background: #fff; }
    #suggestions {
      position: absolute; top: calc(100% + 4px); left: 0; right: 0;
      background: #fff; border: 1px solid #e0e0e0; border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1); z-index: 500;
      max-height: 220px; overflow-y: auto; display: none;
    }
    #suggestions.show { display: block; }
    .sug-item {
      padding: 8px 12px; font-size: 13px; cursor: pointer;
      border-bottom: 1px solid #f0f0f0; line-height: 1.4; color: #222;
    }
    .sug-item:last-child { border-bottom: none; }
    .sug-item:hover { background: #f0f5ff; }
    .sug-sub { font-size: 11px; color: #888; }
    .btn {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 7px 13px; border-radius: 8px; border: 1px solid #d0d0d0;
      background: #fff; color: #333; font-size: 13px;
      font-family: 'Noto Sans JP', sans-serif; cursor: pointer; white-space: nowrap; font-weight: 500;
    }
    .btn:hover { background: #f0f0f0; }
    .btn.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
    .btn.primary:hover { background: #1d4ed8; }

    .map-wrapper { position: relative; flex: 1; overflow: hidden; }
    #map { width: 100%; height: 100%; cursor: crosshair; }

    #tap-loader {
      display: none; position: absolute;
      bottom: 70px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.72); color: #fff; font-size: 12px;
      padding: 8px 18px; border-radius: 20px; z-index: 1000;
      pointer-events: none; white-space: nowrap;
    }
    #tap-loader.show { display: block; }

    .bottom-panel {
      background: #fff; border-top: 1px solid #e0e0e0;
      padding: 10px 14px; flex-shrink: 0; z-index: 200;
    }
    .hint { font-size: 12px; color: #555; }
    #status { font-size: 11px; color: #999; margin-top: 5px; min-height: 14px; }
    #status.ok { color: #16a34a; }
    #status.error { color: #dc2626; }
    #status.loading { color: #d97706; }

    /* ポップアップ */
    .leaflet-popup-content-wrapper {
      border-radius: 14px !important;
      box-shadow: 0 6px 24px rgba(0,0,0,0.16) !important;
      padding: 0 !important; overflow: hidden; border: none !important;
    }
    .leaflet-popup-content { margin: 0 !important; }
    .leaflet-popup-tip-container { display: none; }
    .leaflet-popup-close-button {
      top: 8px !important; right: 10px !important;
      color: #aaa !important; font-size: 18px !important;
    }
    .popup-card { min-width: 230px; max-width: 290px; }
    .popup-header { padding: 12px 36px 10px 14px; border-bottom: 1px solid #f0f0f0; }
    .popup-name { font-size: 14px; font-weight: 700; color: #111; display: block; margin-bottom: 2px; }
    .popup-type { font-size: 11px; color: #888; }
    .popup-body { padding: 10px 14px 12px; }
    .popup-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .popup-label { font-size: 11px; color: #888; }
    .popup-value { font-size: 13px; font-weight: 700; color: #111; text-align: right; }
    .popup-source { font-size: 10px; color: #bbb; margin-left: 4px; font-weight: 400; }
    .popup-badge {
      display: block; margin-top: 8px;
      padding: 6px 0; border-radius: 8px; text-align: center;
      font-size: 13px; font-weight: 700;
    }
    .badge-ok     { background: #dbeafe; color: #1d4ed8; }
    .badge-narrow { background: #fef3c7; color: #92400e; }
    .badge-ng     { background: #fee2e2; color: #b91c1c; }
    .popup-alert {
      margin-top: 8px; padding: 8px 10px; border-radius: 8px;
      font-size: 11px; line-height: 1.6;
    }
    .alert-narrow { background: #fef3c7; color: #92400e; }
    .alert-ng     { background: #fee2e2; color: #b91c1c; }
  </style>
</head>
<body>
  <header>
    <div class="header-top">
      <div class="logo">道路判定マップ</div>
      <div class="header-note">© OpenStreetMap contributors</div>
    </div>
    <div class="search-row">
      <div class="search-wrapper">
        <input id="search-input" class="search-input" type="text"
          placeholder="住所・地名で検索..." autocomplete="off"/>
        <div id="suggestions"></div>
      </div>
      <button class="btn primary" onclick="doSearch()">検索</button>
      <button class="btn" onclick="getLocation()">📍</button>
    </div>
  </header>

  <div class="map-wrapper">
    <div id="map"></div>
    <div id="tap-loader">道路情報を取得中...</div>
  </div>

  <div class="bottom-panel">
    <div class="hint">🔍 調べたい道路をタップしてください</div>
    <div id="status"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
  /* ============================================================
     幅員推定テーブル
     OSMの highway タグから幅員を推定する
     日本の道路幅員の実態に基づく推定値
  ============================================================ */
  const HW_INFO = {
    motorway:      { label:'高速道路',       width:'19.5m以上',    wCat:4, lanes:'複数車線' },
    trunk:         { label:'幹線道路',        width:'13〜19.5m',    wCat:3, lanes:'複数車線' },
    primary:       { label:'主要道路（国道相当）', width:'9〜13m程度', wCat:2, lanes:'2車線以上' },
    secondary:     { label:'二次道路（県道相当）', width:'5.5〜9m程度', wCat:2, lanes:'2車線' },
    tertiary:      { label:'三次道路（市道相当）', width:'5.5〜9m程度', wCat:2, lanes:'2車線程度' },
    residential:   { label:'住宅地道路',      width:'3〜5.5m程度',  wCat:1, lanes:'1〜2車線' },
    living_street: { label:'生活道路',        width:'3〜5.5m程度',  wCat:1, lanes:'1車線' },
    unclassified:  { label:'未分類道路',      width:'3〜5.5m程度',  wCat:1, lanes:'不明' },
    service:       { label:'サービス道路',    width:'3〜5m程度',    wCat:1, lanes:'狭い場合あり' },
    track:         { label:'農道・林道',      width:'3m未満の場合あり', wCat:0, lanes:'1車線以下' },
    footway:       { label:'歩道',            width:'歩行者専用',   wCat:-1, lanes:'-' },
    path:          { label:'小道',            width:'歩行者専用',   wCat:-1, lanes:'-' },
    cycleway:      { label:'自転車道',        width:'自転車専用',   wCat:-1, lanes:'-' },
    pedestrian:    { label:'歩行者専用道路',  width:'歩行者専用',   wCat:-1, lanes:'-' },
    steps:         { label:'階段',            width:'歩行者専用',   wCat:-1, lanes:'-' },
    bridleway:     { label:'河川敷・乗馬道',  width:'車両通行不可', wCat:-1, lanes:'-' },
  };

  // wCat: -1=通行不可, 0=赤(3m未満), 1=黄(3〜5.5m), 2以上=青(通行可)

  function judgeRoad(tags) {
    const hw  = tags.highway || '';
    const info = HW_INFO[hw] || { label: hw, width:'不明', wCat:1, lanes:'不明' };

    let cat      = info.wCat >= 2 ? 'ok' : info.wCat === 1 ? 'narrow' : info.wCat === 0 ? 'narrow' : 'ng';
    let widthStr = info.width;
    let widthSrc = '推定';
    let alertMsg = '';

    // OSMに実測幅員タグがあれば優先
    if (tags.width) {
      const w = parseFloat(tags.width);
      if (!isNaN(w)) {
        widthStr = `${w}m`;
        widthSrc = '実測';
        if (w < 3)        { cat = 'ng';     }
        else if (w < 5.5) { cat = 'narrow'; }
        else              { cat = 'ok';     }
      }
    }
    // lanes タグも参考に
    const lanesVal = tags.lanes ? parseInt(tags.lanes) : null;
    const lanesStr = lanesVal ? `${lanesVal}車線` : info.lanes;

    // access/その他のNG判定（最優先）
    if (tags.access === 'private' || tags.access === 'no') {
      cat = 'ng'; alertMsg = '私道・通行禁止';
    } else if (tags.motor_vehicle === 'no' || tags.motorcar === 'no') {
      cat = 'ng'; alertMsg = '自動車通行禁止';
    } else if (tags.bicycle === 'designated' && tags.foot === 'designated' && !tags.motor_vehicle) {
      cat = 'ng'; alertMsg = '自転車・歩行者専用';
    } else if (tags.service === 'driveway')      { cat = 'ng'; alertMsg = '私有地への進入路'; }
    else if (tags.service === 'parking_aisle')   { cat = 'ng'; alertMsg = '駐車場内通路'; }
    else if (cat === 'ng' && info.wCat === -1)   { alertMsg = info.label + '（車両通行不可）'; }
    else if (cat === 'ng')   { alertMsg = '幅員3m未満（大型車通行困難）'; }
    else if (cat === 'narrow') {
      alertMsg = widthSrc === '実測'
        ? `幅員${widthStr}（大型車の離合注意）`
        : `${widthStr}（住宅地・生活道路、大型車は注意）`;
    }

    return { cat, widthStr, widthSrc, lanesStr, alertMsg };
  }

  function buildPopupHtml(tags, name) {
    const hw    = tags.highway || '';
    const info  = HW_INFO[hw] || { label: hw || '不明' };
    const judge = judgeRoad(tags);

    const badgeClass = { ok:'badge-ok', narrow:'badge-narrow', ng:'badge-ng' }[judge.cat];
    const badgeText  = {
      ok:     '✓ 通行可（普通車・大型車）',
      narrow: '⚠ 要注意（狭い道）',
      ng:     '✕ 通行不可の可能性',
    }[judge.cat];

    let alertHtml = '';
    if (judge.cat === 'narrow') {
      alertHtml = `<div class="popup-alert alert-narrow">⚠ ${judge.alertMsg}<br>ハイエース等の大型車は離合困難な場合があります</div>`;
    } else if (judge.cat === 'ng') {
      alertHtml = `<div class="popup-alert alert-ng">🚫 ${judge.alertMsg}</div>`;
    }

    const srcBadge = judge.widthSrc === '実測'
      ? `<span class="popup-source">（実測値）</span>`
      : `<span class="popup-source">（種別から推定）</span>`;

    return `
      <div class="popup-card">
        <div class="popup-header">
          <span class="popup-name">${name}</span>
          <span class="popup-type">${info.label}</span>
        </div>
        <div class="popup-body">
          <div class="popup-row">
            <span class="popup-label">幅員</span>
            <span class="popup-value">${judge.widthStr}${srcBadge}</span>
          </div>
          <div class="popup-row">
            <span class="popup-label">車線</span>
            <span class="popup-value">${judge.lanesStr}</span>
          </div>
          <div class="popup-badge ${badgeClass}">${badgeText}</div>
          ${alertHtml}
        </div>
      </div>`;
  }

  /* ============================================================
     地図
  ============================================================ */
  let userMarker = null, searchPin = null;
  let warningLines = [];

  function clearWarningLines() {
    warningLines.forEach(l => map.removeLayer(l));
    warningLines = [];
  }

  function drawWarningLine(nodes, nodeIds, cat) {
    const coords = nodeIds.map(id => nodes[id]).filter(n => n).map(n => [n.lat, n.lon]);
    if (coords.length < 2) return;
    const line = L.polyline(coords, {
      color:     '#ef4444',
      weight:    5,
      opacity:   0.85,
      lineCap:   'round',
      lineJoin:  'round',
      dashArray: cat === 'ng' ? '2 7' : null,
    }).addTo(map);
    warningLines.push(line);
  }

  const map = L.map('map', { zoomControl: false, maxZoom: 19 })
    .setView([35.1815, 136.9066], 16);
  L.control.zoom({ position: 'topright' }).addTo(map);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    maxZoom: 19,
  }).addTo(map);

  /* ============================================================
     タップ → Overpass で最寄り道路取得
  ============================================================ */
  const OVERPASS_ENDPOINTS = [
    'https://overpass-api.de/api/interpreter',
    'https://overpass.kumi.systems/api/interpreter',
    'https://overpass.openstreetmap.ru/api/interpreter',
  ];

  async function overpassQuery(q) {
    for (const ep of OVERPASS_ENDPOINTS) {
      try {
        const res = await fetch(ep, {
          method: 'POST', body: q,
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          signal: AbortSignal.timeout(8000),
        });
        if (!res.ok) continue;
        return await res.json();
      } catch { continue; }
    }
    throw new Error('全エンドポイント失敗');
  }

  // 地図を動かしたら赤線をクリア
  map.on('movestart', clearWarningLines);

  map.on('click', async function(e) {
    const { lat, lng } = e.latlng;
    document.getElementById('tap-loader').classList.add('show');

    const q = `[out:json][timeout:8];
way["highway"](around:25,${lat.toFixed(6)},${lng.toFixed(6)});
out body;>;out skel qt;`;

    try {
      const data = await overpassQuery(q);
      document.getElementById('tap-loader').classList.remove('show');

      const ways = data.elements.filter(el => el.type === 'way' && el.tags?.highway);
      if (!ways.length) {
        L.popup({ maxWidth: 260 })
          .setLatLng(e.latlng)
          .setContent(`<div style="padding:12px 14px;font-family:'Noto Sans JP',sans-serif;font-size:13px;color:#666;">
            この付近に道路が見つかりませんでした<br>
            <small style="color:#aaa">道路に近い場所をタップしてください</small>
          </div>`)
          .openOn(map);
        return;
      }

      // タップ地点に最も近い道路を選ぶ
      const nodes = {};
      data.elements.filter(el => el.type === 'node').forEach(n => { nodes[n.id] = n; });

      let bestWay  = ways[0];
      let bestDist = Infinity;
      ways.forEach(way => {
        (way.nodes || []).forEach(nid => {
          const n = nodes[nid];
          if (!n) return;
          const d = Math.hypot(n.lat - lat, n.lon - lng);
          if (d < bestDist) { bestDist = d; bestWay = way; }
        });
      });

      const tags = bestWay.tags || {};
      const name = tags.name || tags['name:ja'] || '名称不明';
      const judge = judgeRoad(tags);

      // 要注意・通行不可の道は赤線を描画
      clearWarningLines();
      if (judge.cat === 'narrow' || judge.cat === 'ng') {
        drawWarningLine(nodes, bestWay.nodes || [], judge.cat);
      }

      L.popup({ maxWidth: 300 })
        .setLatLng(e.latlng)
        .setContent(buildPopupHtml(tags, name))
        .openOn(map);

    } catch (err) {
      document.getElementById('tap-loader').classList.remove('show');
      setStatus('通信エラー。インターネット接続を確認してください。', 'error');
    }
  });

  function setStatus(msg, type) {
    const el = document.getElementById('status');
    el.textContent = msg; el.className = type || '';
  }

  /* ============================================================
     現在地
  ============================================================ */
  function getLocation() {
    if (!navigator.geolocation) { setStatus('位置情報が使えません', 'error'); return; }
    setStatus('位置情報を取得中...', 'loading');
    navigator.geolocation.getCurrentPosition(pos => {
      const lat = pos.coords.latitude, lng = pos.coords.longitude;
      map.setView([lat, lng], 17);
      if (userMarker) map.removeLayer(userMarker);
      userMarker = L.circleMarker([lat, lng], {
        radius: 9, color: '#fff', fillColor: '#f97316', fillOpacity: 1, weight: 3,
      }).addTo(map).bindPopup('現在地');
      setStatus('現在地を取得しました', 'ok');
    }, () => { setStatus('位置情報の取得に失敗しました', 'error'); });
  }

  /* ============================================================
     住所検索
  ============================================================ */
  let sugTimer = null;
  const searchInput = document.getElementById('search-input');
  const sugBox      = document.getElementById('suggestions');

  searchInput.addEventListener('input', () => {
    clearTimeout(sugTimer);
    const q = searchInput.value.trim();
    if (q.length < 2) { hideSug(); return; }
    sugTimer = setTimeout(() => fetchSug(q), 350);
  });
  searchInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { doSearch(); hideSug(); }
    if (e.key === 'Escape') hideSug();
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('.search-wrapper')) hideSug();
  });

  async function fetchSug(q) {
    try {
      const url  = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=5&accept-language=ja&countrycodes=jp`;
      const data = await (await fetch(url, { headers: { 'Accept-Language': 'ja' } })).json();
      if (!data.length) { hideSug(); return; }
      sugBox.innerHTML = data.map(r => {
        const parts = r.display_name.split(',');
        return `<div class="sug-item" data-lat="${r.lat}" data-lng="${r.lon}" data-name="${parts[0].trim()}">
          ${parts[0].trim()}<div class="sug-sub">${parts.slice(1,3).join(', ').trim()}</div>
        </div>`;
      }).join('');
      sugBox.querySelectorAll('.sug-item').forEach(el => {
        el.addEventListener('click', () => {
          searchInput.value = el.dataset.name;
          moveTo(parseFloat(el.dataset.lat), parseFloat(el.dataset.lng), el.dataset.name);
          hideSug();
        });
      });
      sugBox.classList.add('show');
    } catch { hideSug(); }
  }

  function hideSug() { sugBox.classList.remove('show'); }

  async function doSearch() {
    const q = searchInput.value.trim();
    if (!q) return; hideSug();
    try {
      const url  = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=1&accept-language=ja&countrycodes=jp`;
      const data = await (await fetch(url, { headers: { 'Accept-Language': 'ja' } })).json();
      if (!data.length) { setStatus('場所が見つかりませんでした', 'error'); return; }
      const r = data[0];
      moveTo(parseFloat(r.lat), parseFloat(r.lon), r.display_name.split(',')[0].trim());
    } catch { setStatus('検索に失敗しました', 'error'); }
  }

  function moveTo(lat, lng, name) {
    map.setView([lat, lng], 17);
    if (searchPin) map.removeLayer(searchPin);
    searchPin = L.marker([lat, lng]).addTo(map).bindPopup(name).openPopup();
  }
  </script>
</body>
</html>
