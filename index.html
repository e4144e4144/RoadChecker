<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>道路判定マップ</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #f5f5f5;
      color: #1a1a1a;
      font-family: 'Noto Sans JP', sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      flex-shrink: 0;
      z-index: 200;
    }
    .logo { font-size: 16px; font-weight: 700; color: #1a1a1a; }
    .header-note { font-size: 11px; color: #aaa; margin-left: auto; }

    .map-wrapper { position: relative; flex: 1; overflow: hidden; }
    #map { width: 100%; height: 100%; z-index: 1; }

    .bottom-panel {
      background: #fff;
      border-top: 1px solid #e0e0e0;
      flex-shrink: 0;
      z-index: 200;
    }
    .panel-section { padding: 10px 14px 12px; }

    .ctrl-row { display: flex; gap: 8px; align-items: center; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 7px 14px;
      border-radius: 8px;
      border: 1px solid #d0d0d0;
      background: #fff;
      color: #333;
      font-size: 13px;
      font-family: 'Noto Sans JP', sans-serif;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
      font-weight: 500;
    }
    .btn:hover { background: #f5f5f5; border-color: #aaa; }
    .btn.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
    .btn.primary:hover { background: #1d4ed8; }

    .legend-row { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 9px; }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #444; }
    .legend-line { width: 26px; height: 5px; border-radius: 3px; flex-shrink: 0; }

    #status { font-size: 11px; color: #999; margin-top: 7px; min-height: 14px; }
    #status.ok      { color: #16a34a; }
    #status.error   { color: #dc2626; }
    #status.loading { color: #d97706; }

    #loader {
      display: none;
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 14px 22px;
      font-size: 13px;
      color: #333;
      z-index: 1000;
      pointer-events: none;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      align-items: center;
      gap: 10px;
    }
    #loader.show { display: flex; }

    .spinner {
      width: 16px; height: 16px;
      border: 2px solid #ddd;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .leaflet-popup-content-wrapper {
      border-radius: 10px !important;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15) !important;
    }
    .leaflet-popup-content {
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 12px;
      line-height: 1.8;
      margin: 10px 14px !important;
    }
    .road-popup-name { font-size: 13px; font-weight: 700; display: block; margin-bottom: 3px; color: #111; }
    .road-popup-type { color: #555; margin-bottom: 4px; }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; }
    .badge-public  { background: #dbeafe; color: #1d4ed8; }
    .badge-caution { background: #fef3c7; color: #92400e; }
    .badge-ng      { background: #fee2e2; color: #b91c1c; }
    .road-popup-note { font-size: 11px; color: #888; margin-top: 4px; }

    @media (max-width: 400px) {
      .legend-row { gap: 8px; }
      .legend-item { font-size: 11px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">道路判定マップ</div>
    <div class="header-note">※ OSMデータに基づく推定</div>
  </header>

  <div class="map-wrapper">
    <div id="map"></div>
    <div id="loader">
      <div class="spinner"></div>
      <span id="loader-text">データ取得中...</span>
    </div>
  </div>

  <div class="bottom-panel">
    <div class="panel-section">
      <div class="ctrl-row">
        <button class="btn primary" onclick="getLocation()">📍 現在地を取得</button>
        <button class="btn" onclick="fetchRoads()">🔄 再読み込み</button>
      </div>
      <div class="legend-row">
        <div class="legend-item">
          <div class="legend-line" style="background:#2563eb;"></div>公道（車で通行可）
        </div>
        <div class="legend-item">
          <div class="legend-line" style="background:#f59e0b;"></div>要注意（狭い道）
        </div>
        <div class="legend-item">
          <div class="legend-line" style="background:#ef4444;"></div>通行不可の可能性
        </div>
      </div>
      <div id="status"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    /* ============================================================
       道路種別の定義と判定ロジック
    ============================================================ */
    const ROAD_DEFS = {
      // 公道（車で通れる）
      motorway:      { label: '高速道路',               cat: 'public',  weight: 6 },
      trunk:         { label: '幹線道路',               cat: 'public',  weight: 5 },
      primary:       { label: '主要道路',               cat: 'public',  weight: 5 },
      secondary:     { label: '二次道路',               cat: 'public',  weight: 4 },
      tertiary:      { label: '三次道路',               cat: 'public',  weight: 3 },
      // 要注意（狭い・生活道路）
      residential:   { label: '住宅地道路',             cat: 'caution', weight: 3 },
      living_street: { label: '生活道路',               cat: 'caution', weight: 2 },
      unclassified:  { label: '未分類道路',             cat: 'caution', weight: 2 },
      // 通行不可の可能性
      service:       { label: 'サービス道路（私道の可能性）', cat: 'ng', weight: 2 },
      track:         { label: '農道・林道',             cat: 'ng',      weight: 2 },
      footway:       { label: '歩道・歩行者専用',       cat: 'ng',      weight: 2 },
      path:          { label: '小道・歩行者専用',       cat: 'ng',      weight: 1.5 },
      cycleway:      { label: '自転車専用道路',         cat: 'ng',      weight: 2 },
      pedestrian:    { label: '歩行者専用道路',         cat: 'ng',      weight: 2 },
      steps:         { label: '階段',                   cat: 'ng',      weight: 1.5 },
      bridleway:     { label: '乗馬・河川敷道路',       cat: 'ng',      weight: 1.5 },
    };

    const CAT_COLOR   = { public: '#2563eb', caution: '#f59e0b', ng: '#ef4444' };
    const CAT_OPACITY = { public: 0.85,      caution: 0.85,      ng: 0.85      };

    function getRoadInfo(tags) {
      const hw  = tags.highway;
      const def = ROAD_DEFS[hw];
      if (!def) return null;

      let cat  = def.cat;
      let note = '';

      // access タグによる補正
      if (tags.access === 'private' || tags.access === 'no') {
        cat = 'ng'; note = '私道（access=private）';
      }
      if ((tags.access === 'yes' || tags.access === 'public') && cat === 'ng'
          && (hw === 'service' || hw === 'track' || hw === 'unclassified')) {
        cat = 'caution';
      }

      // service タグによる補正
      if (hw === 'service') {
        if (tags.service === 'driveway' || tags.service === 'parking_aisle') {
          cat = 'ng'; note = '私有地内道路';
        } else if (tags.service === 'alley') {
          cat = 'caution'; note = '路地（狭い可能性あり）';
        }
      }

      // 幅員が 3m 未満は要注意
      if (tags.width) {
        const w = parseFloat(tags.width);
        if (!isNaN(w) && w < 3.0 && cat === 'public') {
          cat = 'caution'; note = `車幅注意（幅 ${w}m）`;
        }
      }

      // 1車線は要注意
      if (tags.lanes && parseInt(tags.lanes) <= 1 && cat === 'public') {
        cat = 'caution'; note = '1車線（狭い可能性あり）';
      }

      // 自転車・歩行者専用（河川敷等）
      if (tags.bicycle === 'designated' && tags.foot === 'designated' && !tags.motor_vehicle) {
        cat = 'ng'; note = '自転車・歩行者専用';
      }
      if (tags.motor_vehicle === 'no' || tags.motorcar === 'no') {
        cat = 'ng'; note = '自動車通行不可';
      }

      return { label: def.label, cat, weight: def.weight, note };
    }

    function badgeHtml(cat) {
      if (cat === 'public')  return '<span class="badge badge-public">✓ 公道</span>';
      if (cat === 'caution') return '<span class="badge badge-caution">⚠ 要注意（狭い道）</span>';
      return '<span class="badge badge-ng">✕ 通行不可の可能性</span>';
    }

    /* ============================================================
       地図・UI メインロジック
    ============================================================ */
    let userLat    = 35.1815;  // デフォルト: 名古屋
    let userLng    = 136.9066;
    let roadLayers = [];

    const map = L.map('map', { zoomControl: false }).setView([userLat, userLng], 15);
    L.control.zoom({ position: 'topright' }).addTo(map);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      maxZoom: 19,
    }).addTo(map);

    const userMarker = L.circleMarker([userLat, userLng], {
      radius: 9, color: '#fff', fillColor: '#f97316', fillOpacity: 1, weight: 3,
    }).addTo(map).bindPopup('現在地');

    function showLoader(text) {
      document.getElementById('loader-text').textContent = text || 'データ取得中...';
      document.getElementById('loader').classList.add('show');
    }
    function hideLoader() {
      document.getElementById('loader').classList.remove('show');
    }
    function setStatus(msg, type) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = type || '';
    }

    async function overpassFetch(query) {
      const res = await fetch('https://overpass-api.de/api/interpreter', {
        method: 'POST',
        body: query,
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    }

    function renderWays(elements) {
      const nodes = {};
      elements.filter(e => e.type === 'node').forEach(n => { nodes[n.id] = [n.lat, n.lon]; });

      const counts = { public: 0, caution: 0, ng: 0 };

      elements.filter(e => e.type === 'way').forEach(way => {
        const tags  = way.tags || {};
        const info  = getRoadInfo(tags);
        if (!info) return;
        const coords = (way.nodes || []).map(id => nodes[id]).filter(Boolean);
        if (coords.length < 2) return;

        counts[info.cat]++;
        const line = L.polyline(coords, {
          color: CAT_COLOR[info.cat], weight: info.weight, opacity: CAT_OPACITY[info.cat],
        }).addTo(map);

        const name     = tags.name || tags['name:ja'] || '名称不明';
        const noteHtml = info.note ? `<div class="road-popup-note">${info.note}</div>` : '';
        line.bindPopup(`
          <span class="road-popup-name">${name}</span>
          <div class="road-popup-type">種別：${info.label}</div>
          ${badgeHtml(info.cat)}
          ${noteHtml}
        `);
        roadLayers.push(line);
      });

      return counts;
    }

    async function fetchRoads() {
      roadLayers.forEach(l => map.removeLayer(l));
      roadLayers = [];
      showLoader('周辺の道路データを取得中...');
      setStatus('取得中...', 'loading');

      const query = `[out:json][timeout:25];
(way["highway"](around:500,${userLat},${userLng}););
out body;>;out skel qt;`;

      try {
        const data   = await overpassFetch(query);
        const counts = renderWays(data.elements);
        const total  = counts.public + counts.caution + counts.ng;
        setStatus(
          `${total}本表示　公道 ${counts.public}本 ／ 要注意 ${counts.caution}本 ／ 通行不可の可能性 ${counts.ng}本`,
          'ok'
        );
      } catch (err) {
        console.error(err);
        setStatus('取得失敗。インターネット接続を確認してください。', 'error');
      }
      hideLoader();
    }

    function getLocation() {
      if (!navigator.geolocation) {
        setStatus('この端末では位置情報が使えません', 'error');
        return;
      }
      setStatus('位置情報を取得中...', 'loading');
      navigator.geolocation.getCurrentPosition(
        pos => {
          userLat = pos.coords.latitude;
          userLng = pos.coords.longitude;
          map.setView([userLat, userLng], 16);
          userMarker.setLatLng([userLat, userLng]);
          setStatus('現在地を取得しました', 'ok');
          fetchRoads();
        },
        () => { setStatus('位置情報の取得に失敗しました', 'error'); }
      );
    }

    fetchRoads();
  </script>
</body>
</html>
