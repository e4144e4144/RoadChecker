<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>道路判定マップ</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <div class="logo">道路判定マップ</div>
    <div class="header-note">※ OSMデータに基づく推定</div>
  </header>

  <div class="map-wrapper">
    <div id="map"></div>
    <div id="loader">
      <div class="spinner"></div>
      <span id="loader-text">データ取得中...</span>
    </div>
  </div>

  <div class="bottom-panel">
    <div class="panel-section">
      <div class="ctrl-row">
        <button class="btn primary" onclick="getLocation()">📍 現在地を取得</button>
        <button class="btn" onclick="fetchRoads()">🔄 再読み込み</button>
      </div>
      <div class="legend-row">
        <div class="legend-item">
          <div class="legend-line" style="background:#2563eb;"></div>
          公道（車で通行可）
        </div>
        <div class="legend-item">
          <div class="legend-line" style="background:#f59e0b;"></div>
          要注意（狭い道）
        </div>
        <div class="legend-item">
          <div class="legend-line" style="background:#ef4444;"></div>
          通行不可の可能性
        </div>
      </div>
      <div id="status"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/roads.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
