<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>道路判定マップ</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans JP', sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      padding: 10px 14px;
      flex-shrink: 0;
      z-index: 300;
    }
    .header-top { display: flex; align-items: center; margin-bottom: 8px; }
    .logo { font-size: 15px; font-weight: 700; color: #111; }
    .header-note { font-size: 10px; color: #bbb; margin-left: auto; }

    .search-row { display: flex; gap: 6px; }
    .search-wrapper { position: relative; flex: 1; min-width: 0; }
    .search-input {
      width: 100%; padding: 8px 12px; border-radius: 8px;
      border: 1px solid #d0d0d0; font-size: 13px;
      font-family: 'Noto Sans JP', sans-serif;
      outline: none; background: #f8f8f8;
    }
    .search-input:focus { border-color: #2563eb; background: #fff; }

    #suggestions {
      position: absolute; top: calc(100% + 4px); left: 0; right: 0;
      background: #fff; border: 1px solid #e0e0e0; border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1); z-index: 500;
      max-height: 220px; overflow-y: auto; display: none;
    }
    #suggestions.show { display: block; }
    .sug-item {
      padding: 8px 12px; font-size: 13px; cursor: pointer;
      border-bottom: 1px solid #f0f0f0; line-height: 1.4; color: #222;
    }
    .sug-item:last-child { border-bottom: none; }
    .sug-item:hover { background: #f0f5ff; }
    .sug-sub { font-size: 11px; color: #888; }

    .btn {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 7px 13px; border-radius: 8px; border: 1px solid #d0d0d0;
      background: #fff; color: #333; font-size: 13px;
      font-family: 'Noto Sans JP', sans-serif;
      cursor: pointer; white-space: nowrap; font-weight: 500;
    }
    .btn:hover { background: #f0f0f0; }
    .btn.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
    .btn.primary:hover { background: #1d4ed8; }

    .map-wrapper { position: relative; flex: 1; overflow: hidden; }
    #map { width: 100%; height: 100%; cursor: pointer; }

    /* タップ中のローディング表示 */
    #tap-loader {
      display: none;
      position: absolute;
      bottom: 70px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      color: #fff; font-size: 12px;
      padding: 8px 16px; border-radius: 20px;
      z-index: 1000; pointer-events: none;
      white-space: nowrap;
    }
    #tap-loader.show { display: block; }

    .bottom-panel {
      background: #fff; border-top: 1px solid #e0e0e0;
      padding: 10px 14px; flex-shrink: 0; z-index: 200;
    }
    .hint { font-size: 12px; color: #555; }
    #status { font-size: 11px; color: #999; margin-top: 5px; min-height: 14px; }
    #status.ok      { color: #16a34a; }
    #status.error   { color: #dc2626; }
    #status.loading { color: #d97706; }

    /* ポップアップ */
    .leaflet-popup-content-wrapper {
      border-radius: 14px !important;
      box-shadow: 0 6px 24px rgba(0,0,0,0.16) !important;
      padding: 0 !important;
      overflow: hidden;
      border: none !important;
    }
    .leaflet-popup-content { margin: 0 !important; }
    .leaflet-popup-tip { display: none; }
    .leaflet-popup-tip-container { display: none; }
    .leaflet-popup-close-button {
      top: 8px !important; right: 10px !important;
      color: #999 !important; font-size: 18px !important;
    }

    .popup-card { min-width: 230px; max-width: 280px; }
    .popup-header {
      padding: 12px 14px 10px;
      border-bottom: 1px solid #f0f0f0;
    }
    .popup-name { font-size: 14px; font-weight: 700; color: #111; display: block; margin-bottom: 2px; }
    .popup-type { font-size: 11px; color: #888; }
    .popup-body { padding: 10px 14px 12px; }
    .popup-row {
      display: flex; align-items: center;
      justify-content: space-between; margin-bottom: 5px;
    }
    .popup-label { font-size: 11px; color: #888; }
    .popup-value { font-size: 13px; font-weight: 700; color: #111; }
    .popup-badge {
      display: inline-block; margin-top: 8px;
      padding: 4px 12px; border-radius: 20px;
      font-size: 12px; font-weight: 700;
    }
    .badge-ok     { background: #dbeafe; color: #1d4ed8; }
    .badge-narrow { background: #fef3c7; color: #92400e; }
    .badge-ng     { background: #fee2e2; color: #b91c1c; }
    .popup-alert {
      margin-top: 8px; padding: 7px 10px;
      border-radius: 8px; font-size: 11px; line-height: 1.6;
    }
    .alert-narrow { background: #fef3c7; color: #92400e; }
    .alert-ng     { background: #fee2e2; color: #b91c1c; }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <div class="logo">道路判定マップ</div>
      <div class="header-note">幅員データ：国土地理院 / OSM</div>
    </div>
    <div class="search-row">
      <div class="search-wrapper">
        <input id="search-input" class="search-input" type="text"
          placeholder="住所・地名で検索..." autocomplete="off"/>
        <div id="suggestions"></div>
      </div>
      <button class="btn primary" onclick="doSearch()">検索</button>
      <button class="btn" onclick="getLocation()">📍</button>
    </div>
  </header>

  <div class="map-wrapper">
    <div id="map"></div>
    <div id="tap-loader">道路情報を取得中...</div>
  </div>

  <div class="bottom-panel">
    <div class="hint">🔍 調べたい道路をタップしてください</div>
    <div id="status"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
  /* ============================================================
     道路情報の判定
  ============================================================ */

  const RDCTG_LABEL = ['国道','都道府県道','市区町村道','高速道路','','その他','不明'];

  // OSM highway タグ → 日本語
  const HW_LABEL = {
    motorway:'高速道路', trunk:'幹線道路', primary:'主要道路',
    secondary:'二次道路', tertiary:'三次道路', residential:'住宅地道路',
    living_street:'生活道路', unclassified:'未分類道路',
    service:'サービス道路', track:'農道・林道',
    footway:'歩道', path:'小道', cycleway:'自転車道',
    pedestrian:'歩行者専用道路', steps:'階段', bridleway:'河川敷道路',
  };

  // 通行不可カテゴリのhighway
  const NG_HW = new Set(['footway','path','cycleway','pedestrian','steps','bridleway','track']);

  function judgeFromOSM(tags) {
    const hw = tags.highway || '';
    let cat = 'ok', reason = '';

    if (NG_HW.has(hw)) {
      cat = 'ng';
      reason = HW_LABEL[hw] || '車両通行不可';
    } else if (tags.access === 'private' || tags.access === 'no') {
      cat = 'ng'; reason = '私道・通行禁止';
    } else if (tags.motor_vehicle === 'no' || tags.motorcar === 'no') {
      cat = 'ng'; reason = '自動車通行禁止';
    } else if (tags.bicycle === 'designated' && tags.foot === 'designated') {
      cat = 'ng'; reason = '自転車・歩行者専用';
    } else if (tags.service === 'driveway' || tags.service === 'parking_aisle') {
      cat = 'ng'; reason = '私有地内道路';
    } else if (hw === 'residential' || hw === 'living_street' || hw === 'unclassified') {
      cat = 'narrow'; reason = '住宅地・生活道路（幅員要確認）';
    } else if (hw === 'service') {
      cat = 'narrow'; reason = 'サービス道路（幅員要確認）';
    }

    // 幅員タグがあれば優先
    if (tags.width) {
      const w = parseFloat(tags.width);
      if (!isNaN(w)) {
        if (w < 3)   { cat = 'ng';     reason = `幅員 ${w}m（通行困難）`; }
        else if (w < 5.5) { cat = 'narrow'; reason = `幅員 ${w}m（大型車注意）`; }
        else         { cat = 'ok';     reason = `幅員 ${w}m`; }
      }
    }

    return { cat, reason };
  }

  function buildPopupHtml(road) {
    const { name, hwLabel, rdLabel, widthLabel, cat, reason, accessNote } = road;

    const badgeClass = { ok:'badge-ok', narrow:'badge-narrow', ng:'badge-ng' }[cat];
    const badgeText  = { ok:'✓ 通行可', narrow:'⚠ 要注意', ng:'✕ 通行不可の可能性' }[cat];

    let alertHtml = '';
    if (cat === 'narrow') {
      alertHtml = `<div class="popup-alert alert-narrow">⚠ ${reason}<br>ハイエース等の大型車は離合困難な可能性があります</div>`;
    } else if (cat === 'ng') {
      alertHtml = `<div class="popup-alert alert-ng">🚫 ${reason}<br>車での通行は避けてください</div>`;
    }

    const accessHtml = accessNote
      ? `<div class="popup-row"><span class="popup-label">通行条件</span><span class="popup-value" style="color:#dc2626">${accessNote}</span></div>`
      : '';

    return `
      <div class="popup-card">
        <div class="popup-header">
          <span class="popup-name">${name}</span>
          <span class="popup-type">${hwLabel}${rdLabel ? '　' + rdLabel : ''}</span>
        </div>
        <div class="popup-body">
          <div class="popup-row">
            <span class="popup-label">幅員</span>
            <span class="popup-value">${widthLabel}</span>
          </div>
          ${accessHtml}
          <div><span class="popup-badge ${badgeClass}">${badgeText}</span></div>
          ${alertHtml}
        </div>
      </div>`;
  }

  /* ============================================================
     地図
  ============================================================ */
  let userMarker = null;
  let searchPin  = null;

  const map = L.map('map', { zoomControl: false, maxZoom: 19 })
    .setView([35.1815, 136.9066], 16);

  L.control.zoom({ position: 'topright' }).addTo(map);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    maxZoom: 19,
  }).addTo(map);

  /* ============================================================
     地図タップ → 最寄り道路を Overpass で取得
  ============================================================ */
  map.on('click', async function(e) {
    const lat = e.latlng.lat;
    const lng = e.latlng.lng;

    showTapLoader();

    // タップ地点から半径30m以内の道路を取得
    const query = `[out:json][timeout:10];
way["highway"](around:30,${lat},${lng});
out body;>;out skel qt;`;

    try {
      const res  = await fetch('https://overpass-api.de/api/interpreter', {
        method: 'POST', body: query,
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      });
      const data = await res.json();
      hideTapLoader();

      const ways = data.elements.filter(e => e.type === 'way');
      if (!ways.length) {
        L.popup({ maxWidth: 240 })
          .setLatLng(e.latlng)
          .setContent('<div style="padding:12px 14px;font-family:\'Noto Sans JP\',sans-serif;font-size:13px;color:#555;">この付近に道路データが見つかりませんでした</div>')
          .openOn(map);
        return;
      }

      // タップ地点に最も近い道路を選ぶ
      const nodes = {};
      data.elements.filter(el => el.type === 'node').forEach(n => { nodes[n.id] = n; });

      let bestWay = ways[0];
      let bestDist = Infinity;
      ways.forEach(way => {
        (way.nodes || []).forEach(nid => {
          const n = nodes[nid];
          if (!n) return;
          const d = Math.hypot(n.lat - lat, n.lon - lng);
          if (d < bestDist) { bestDist = d; bestWay = way; }
        });
      });

      const tags = bestWay.tags || {};
      const hw   = tags.highway || '';
      const judge = judgeFromOSM(tags);

      // 幅員ラベル
      let widthLabel = '不明';
      if (tags.width) {
        widthLabel = `${tags.width}m`;
      } else if (hw === 'motorway' || hw === 'trunk') {
        widthLabel = '13m以上（推定）';
      } else if (hw === 'primary') {
        widthLabel = '5.5〜13m（推定）';
      } else if (hw === 'secondary' || hw === 'tertiary') {
        widthLabel = '5.5m前後（推定）';
      } else if (hw === 'residential' || hw === 'living_street') {
        widthLabel = '3〜5.5m程度（推定）';
      } else if (hw === 'service' || hw === 'unclassified') {
        widthLabel = '不明（要確認）';
      }

      const road = {
        name:       tags.name || tags['name:ja'] || '名称不明',
        hwLabel:    HW_LABEL[hw] || hw,
        rdLabel:    '',
        widthLabel,
        cat:        judge.cat,
        reason:     judge.reason,
        accessNote: tags.access === 'private' ? '通行禁止（私道）' : '',
      };

      L.popup({ maxWidth: 300 })
        .setLatLng(e.latlng)
        .setContent(buildPopupHtml(road))
        .openOn(map);

    } catch (err) {
      hideTapLoader();
      setStatus('データ取得に失敗しました。再度タップしてください。', 'error');
    }
  });

  function showTapLoader() { document.getElementById('tap-loader').classList.add('show'); }
  function hideTapLoader()  { document.getElementById('tap-loader').classList.remove('show'); }
  function setStatus(msg, type) {
    const el = document.getElementById('status');
    el.textContent = msg; el.className = type || '';
  }

  /* ============================================================
     現在地
  ============================================================ */
  function getLocation() {
    if (!navigator.geolocation) { setStatus('位置情報が使えません', 'error'); return; }
    setStatus('位置情報を取得中...', 'loading');
    navigator.geolocation.getCurrentPosition(pos => {
      const lat = pos.coords.latitude, lng = pos.coords.longitude;
      map.setView([lat, lng], 17);
      if (userMarker) map.removeLayer(userMarker);
      userMarker = L.circleMarker([lat, lng], {
        radius: 9, color: '#fff', fillColor: '#f97316', fillOpacity: 1, weight: 3,
      }).addTo(map).bindPopup('現在地');
      setStatus('現在地を取得しました', 'ok');
    }, () => { setStatus('位置情報の取得に失敗しました', 'error'); });
  }

  /* ============================================================
     住所検索
  ============================================================ */
  let sugTimer = null;
  const searchInput = document.getElementById('search-input');
  const sugBox      = document.getElementById('suggestions');

  searchInput.addEventListener('input', () => {
    clearTimeout(sugTimer);
    const q = searchInput.value.trim();
    if (q.length < 2) { hideSug(); return; }
    sugTimer = setTimeout(() => fetchSug(q), 350);
  });
  searchInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { doSearch(); hideSug(); }
    if (e.key === 'Escape') hideSug();
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('.search-wrapper')) hideSug();
  });

  async function fetchSug(q) {
    try {
      const url  = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=5&accept-language=ja&countrycodes=jp`;
      const data = await (await fetch(url, { headers: { 'Accept-Language': 'ja' } })).json();
      if (!data.length) { hideSug(); return; }
      sugBox.innerHTML = data.map(r => {
        const parts = r.display_name.split(',');
        return `<div class="sug-item" data-lat="${r.lat}" data-lng="${r.lon}" data-name="${parts[0].trim()}">
          ${parts[0].trim()}<div class="sug-sub">${parts.slice(1,3).join(', ').trim()}</div>
        </div>`;
      }).join('');
      sugBox.querySelectorAll('.sug-item').forEach(el => {
        el.addEventListener('click', () => {
          searchInput.value = el.dataset.name;
          moveTo(parseFloat(el.dataset.lat), parseFloat(el.dataset.lng), el.dataset.name);
          hideSug();
        });
      });
      sugBox.classList.add('show');
    } catch { hideSug(); }
  }

  function hideSug() { sugBox.classList.remove('show'); }

  async function doSearch() {
    const q = searchInput.value.trim();
    if (!q) return;
    hideSug();
    try {
      const url  = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=1&accept-language=ja&countrycodes=jp`;
      const data = await (await fetch(url, { headers: { 'Accept-Language': 'ja' } })).json();
      if (!data.length) { setStatus('場所が見つかりませんでした', 'error'); return; }
      const r = data[0];
      moveTo(parseFloat(r.lat), parseFloat(r.lon), r.display_name.split(',')[0].trim());
    } catch { setStatus('検索に失敗しました', 'error'); }
  }

  function moveTo(lat, lng, name) {
    map.setView([lat, lng], 17);
    if (searchPin) map.removeLayer(searchPin);
    searchPin = L.marker([lat, lng]).addTo(map).bindPopup(name).openPopup();
  }
  </script>
</body>
</html>
