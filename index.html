<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>道路判定マップ</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans JP', sans-serif;
      height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
    }
    header {
      background: #fff; border-bottom: 1px solid #e0e0e0;
      padding: 10px 14px; flex-shrink: 0; z-index: 300;
    }
    .header-top { display: flex; align-items: center; margin-bottom: 8px; }
    .logo { font-size: 15px; font-weight: 700; color: #111; }
    .header-note { font-size: 10px; color: #bbb; margin-left: auto; }
    .search-row { display: flex; gap: 6px; }
    .search-wrapper { position: relative; flex: 1; min-width: 0; }
    .search-input {
      width: 100%; padding: 8px 12px; border-radius: 8px;
      border: 1px solid #d0d0d0; font-size: 13px;
      font-family: 'Noto Sans JP', sans-serif; outline: none; background: #f8f8f8;
    }
    .search-input:focus { border-color: #2563eb; background: #fff; }
    #suggestions {
      position: absolute; top: calc(100% + 4px); left: 0; right: 0;
      background: #fff; border: 1px solid #e0e0e0; border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1); z-index: 500;
      max-height: 220px; overflow-y: auto; display: none;
    }
    #suggestions.show { display: block; }
    .sug-item {
      padding: 8px 12px; font-size: 13px; cursor: pointer;
      border-bottom: 1px solid #f0f0f0; line-height: 1.4; color: #222;
    }
    .sug-item:last-child { border-bottom: none; }
    .sug-item:hover { background: #f0f5ff; }
    .sug-sub { font-size: 11px; color: #888; }
    .btn {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 7px 13px; border-radius: 8px; border: 1px solid #d0d0d0;
      background: #fff; color: #333; font-size: 13px;
      font-family: 'Noto Sans JP', sans-serif; cursor: pointer; white-space: nowrap; font-weight: 500;
    }
    .btn:hover { background: #f0f0f0; }
    .btn.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
    .btn.primary:hover { background: #1d4ed8; }
    .map-wrapper { position: relative; flex: 1; overflow: hidden; }
    #map { width: 100%; height: 100%; cursor: crosshair; }
    #tap-loader {
      display: none; position: absolute;
      bottom: 70px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.72); color: #fff; font-size: 12px;
      padding: 8px 18px; border-radius: 20px; z-index: 1000;
      pointer-events: none; white-space: nowrap;
    }
    #tap-loader.show { display: block; }
    .bottom-panel {
      background: #fff; border-top: 1px solid #e0e0e0;
      padding: 10px 14px; flex-shrink: 0; z-index: 200;
    }
    .hint { font-size: 12px; color: #555; }
    #status { font-size: 11px; color: #999; margin-top: 5px; min-height: 14px; }
    #status.ok { color: #16a34a; }
    #status.error { color: #dc2626; }
    #status.loading { color: #d97706; }

    /* ポップアップ */
    .leaflet-popup-content-wrapper {
      border-radius: 14px !important;
      box-shadow: 0 6px 24px rgba(0,0,0,0.16) !important;
      padding: 0 !important; overflow: hidden; border: none !important;
    }
    .leaflet-popup-content { margin: 0 !important; }
    .leaflet-popup-tip-container { display: none; }
    .leaflet-popup-close-button { top: 8px !important; right: 10px !important; color: #999 !important; font-size: 18px !important; }
    .popup-card { min-width: 230px; max-width: 290px; }
    .popup-header { padding: 12px 36px 10px 14px; border-bottom: 1px solid #f0f0f0; }
    .popup-name { font-size: 14px; font-weight: 700; color: #111; display: block; margin-bottom: 2px; }
    .popup-type { font-size: 11px; color: #888; }
    .popup-body { padding: 10px 14px 12px; }
    .popup-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .popup-row:last-child { margin-bottom: 0; }
    .popup-label { font-size: 11px; color: #888; }
    .popup-value { font-size: 13px; font-weight: 700; color: #111; }
    .popup-badge {
      display: block; margin-top: 8px;
      padding: 5px 0; border-radius: 8px; text-align: center;
      font-size: 13px; font-weight: 700;
    }
    .badge-ok     { background: #dbeafe; color: #1d4ed8; }
    .badge-narrow { background: #fef3c7; color: #92400e; }
    .badge-ng     { background: #fee2e2; color: #b91c1c; }
    .popup-alert {
      margin-top: 8px; padding: 8px 10px; border-radius: 8px;
      font-size: 11px; line-height: 1.6;
    }
    .alert-narrow { background: #fef3c7; color: #92400e; }
    .alert-ng     { background: #fee2e2; color: #b91c1c; }
  </style>
</head>
<body>
  <header>
    <div class="header-top">
      <div class="logo">道路判定マップ</div>
      <div class="header-note">幅員データ：国土地理院</div>
    </div>
    <div class="search-row">
      <div class="search-wrapper">
        <input id="search-input" class="search-input" type="text"
          placeholder="住所・地名で検索..." autocomplete="off"/>
        <div id="suggestions"></div>
      </div>
      <button class="btn primary" onclick="doSearch()">検索</button>
      <button class="btn" onclick="getLocation()">📍</button>
    </div>
  </header>
  <div class="map-wrapper">
    <div id="map"></div>
    <div id="tap-loader">取得中...</div>
  </div>
  <div class="bottom-panel">
    <div class="hint">🔍 調べたい道路をタップしてください</div>
    <div id="status"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- pbf: Mapbox軽量PBFデコーダー -->
  <script src="https://unpkg.com/pbf@3.2.1/dist/pbf.js"></script>
  <!-- vector-tile: MVT(PBF)をデコードするライブラリ -->
  <script src="https://unpkg.com/@mapbox/vector-tile@1.3.1/dist/vector-tile.js"></script>

  <script>
  /* ============================================================
     タイル座標計算
  ============================================================ */
  const TILE_Z = 16; // 地理院タイルはZ=16が詳細で幅員データも豊富

  function latlng2tile(lat, lng, z) {
    const x = Math.floor((lng + 180) / 360 * Math.pow(2, z));
    const rad = lat * Math.PI / 180;
    const y = Math.floor((1 - Math.log(Math.tan(rad) + 1 / Math.cos(rad)) / Math.PI) / 2 * Math.pow(2, z));
    return { x, y, z };
  }

  // タイル内のピクセル座標（0〜4095）
  function latlng2tilePixel(lat, lng, z, tx, ty) {
    const extent = 4096;
    const n = Math.pow(2, z);
    const px = (lng / 360 + 0.5) * n * extent - tx * extent;
    const sinLat = Math.sin(lat * Math.PI / 180);
    const py = (0.5 - Math.log((1 + sinLat) / (1 - sinLat)) / (4 * Math.PI)) * n * extent - ty * extent;
    return { px, py };
  }

  /* ============================================================
     地理院PBFタイル取得・デコード
  ============================================================ */
  const tileCache = {};

  async function fetchGSITile(z, x, y) {
    const key = `${z}/${x}/${y}`;
    if (tileCache[key]) return tileCache[key];
    const url = `https://cyberjapandata.gsi.go.jp/xyz/experimental_bvmap/${z}/${x}/${y}.pbf`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`tile fetch failed: ${res.status}`);
    const buf = await res.arrayBuffer();
    const tile = new VectorTile.VectorTile(new Pbf(buf));
    tileCache[key] = tile;
    return tile;
  }

  /* ============================================================
     タップ座標に最も近い道路フィーチャを取得
  ============================================================ */
  async function getNearestRoad(lat, lng) {
    const { x, y, z } = latlng2tile(lat, lng, TILE_Z);
    const { px, py } = latlng2tilePixel(lat, lng, z, x, y);
    const tile = await fetchGSITile(z, x, y);

    const roadLayer = tile.layers['road'];
    if (!roadLayer) return null;

    let best = null;
    let bestDist = Infinity;
    const SEARCH_PX = 200; // タイル内ピクセル距離で検索範囲

    for (let i = 0; i < roadLayer.length; i++) {
      const feat = roadLayer.feature(i);
      const props = feat.properties;

      // 徒歩道・自転車道・河川敷は除外しない（情報として表示）
      const geom = feat.loadGeometry();
      for (const ring of geom) {
        for (let j = 0; j < ring.length - 1; j++) {
          const p1 = ring[j], p2 = ring[j + 1];
          const dist = pointToSegmentDist(px, py, p1.x, p1.y, p2.x, p2.y);
          if (dist < bestDist) {
            bestDist = dist;
            best = props;
          }
        }
      }
    }

    if (bestDist > SEARCH_PX) return null;
    return best;
  }

  function pointToSegmentDist(px, py, ax, ay, bx, by) {
    const dx = bx - ax, dy = by - ay;
    if (dx === 0 && dy === 0) return Math.hypot(px - ax, py - ay);
    const t = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / (dx * dx + dy * dy)));
    return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
  }

  /* ============================================================
     判定ロジック
  ============================================================ */
  const WIDTH_LABEL  = ['3m未満', '3〜5.5m未満', '5.5〜13m', '13〜19.5m', '19.5m以上', '不明', '不明'];
  const WIDTH_RANGE  = ['〜3m', '3〜5.5m', '5.5〜13m', '13〜19.5m', '19.5m〜', '', ''];
  const RDCTG_LABEL  = ['国道', '都道府県道', '市区町村道', '高速道路', '', 'その他', '不明'];

  const NG_FTCODES = new Set([2703,2714,2722,2723,3201,3202,3203,3211,3212,3213]);
  const NG_FTLABEL = {
    2703:'徒歩道・遊歩道', 2714:'徒歩道',
    2722:'自転車歩行者道', 2723:'自転車専用道路',
    3201:'河川敷・庭園路', 3202:'河川敷・庭園路', 3203:'河川敷・庭園路',
    3211:'公園内通路', 3212:'公園内通路', 3213:'公園内通路',
  };

  function buildResult(props) {
    const ftCode   = props.ftCode   || 0;
    const rnkWidth = props.rnkWidth ?? 6;
    const rdCtg    = props.rdCtg    ?? 6;
    const name     = props.name || props.knj || '名称不明';
    const rdLabel  = RDCTG_LABEL[rdCtg] || 'その他';
    const wLabel   = WIDTH_LABEL[rnkWidth] || '不明';
    const wRange   = WIDTH_RANGE[rnkWidth] || '';

    let cat = 'ok', alertMsg = '';

    // ① NG ftCode（徒歩道・自転車道・河川敷）
    if (NG_FTCODES.has(ftCode)) {
      cat = 'ng';
      alertMsg = (NG_FTLABEL[ftCode] || '車両通行不可') + '（車での通行は避けてください）';
    }
    // ② 私道フラグ
    else if (props.priRd === 1) {
      cat = 'ng'; alertMsg = '私道・私有地内道路';
    }
    // ③ 自転車専用
    else if (props.cycleRd === 1) {
      cat = 'ng'; alertMsg = '自転車専用道路';
    }
    // ④ 幅員で判定
    else if (rnkWidth === 0) {
      cat = 'ng'; alertMsg = '幅員3m未満（ハイエース等の通行困難）';
    }
    else if (rnkWidth === 1) {
      cat = 'narrow'; alertMsg = '幅員3〜5.5m未満（大型車の離合注意）';
    }
    else if (rnkWidth >= 2 && rnkWidth <= 4) {
      cat = 'ok';
    }
    // ⑤ 幅員不明の場合は道路種別で推定
    else {
      if (rdCtg === 0 || rdCtg === 1 || rdCtg === 3) { cat = 'ok'; }
      else { cat = 'narrow'; alertMsg = '幅員データなし（市区町村道以下・要確認）'; }
    }

    const badgeClass = { ok:'badge-ok', narrow:'badge-narrow', ng:'badge-ng' }[cat];
    const badgeText  = { ok:'✓ 通行可', narrow:'⚠ 要注意（狭い道）', ng:'✕ 通行不可の可能性' }[cat];

    let alertHtml = '';
    if (cat === 'narrow') {
      alertHtml = `<div class="popup-alert alert-narrow">⚠ ${alertMsg}</div>`;
    } else if (cat === 'ng') {
      alertHtml = `<div class="popup-alert alert-ng">🚫 ${alertMsg}</div>`;
    }

    const wDisplay = rnkWidth <= 4 ? `${wLabel}　<span style="color:#888;font-weight:400;font-size:11px;">(${wRange})</span>` : wLabel;

    return `
      <div class="popup-card">
        <div class="popup-header">
          <span class="popup-name">${name}</span>
          <span class="popup-type">${rdLabel}</span>
        </div>
        <div class="popup-body">
          <div class="popup-row">
            <span class="popup-label">幅員区分</span>
            <span class="popup-value">${wDisplay}</span>
          </div>
          <div class="popup-badge ${badgeClass}">${badgeText}</div>
          ${alertHtml}
        </div>
      </div>`;
  }

  /* ============================================================
     地図初期化
  ============================================================ */
  let userMarker = null, searchPin = null;

  const map = L.map('map', { zoomControl: false, maxZoom: 19 })
    .setView([35.1815, 136.9066], 16);

  L.control.zoom({ position: 'topright' }).addTo(map);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors　幅員：<a href="https://maps.gsi.go.jp/development/ichiran.html">国土地理院</a>',
    maxZoom: 19,
  }).addTo(map);

  /* ============================================================
     タップで道路情報取得
  ============================================================ */
  map.on('click', async function(e) {
    const { lat, lng } = e.latlng;
    document.getElementById('tap-loader').classList.add('show');
    try {
      const props = await getNearestRoad(lat, lng);
      document.getElementById('tap-loader').classList.remove('show');
      if (!props) {
        L.popup({ maxWidth: 240 })
          .setLatLng(e.latlng)
          .setContent('<div style="padding:12px 14px;font-family:\'Noto Sans JP\',sans-serif;font-size:13px;color:#666;">この付近に道路データが見つかりませんでした<br><small style="color:#aaa">もう少し道路に近い場所をタップしてください</small></div>')
          .openOn(map);
        return;
      }
      L.popup({ maxWidth: 300 })
        .setLatLng(e.latlng)
        .setContent(buildResult(props))
        .openOn(map);
    } catch (err) {
      document.getElementById('tap-loader').classList.remove('show');
      setStatus('データ取得に失敗しました。再度タップしてください。', 'error');
    }
  });

  function setStatus(msg, type) {
    const el = document.getElementById('status');
    el.textContent = msg; el.className = type || '';
  }

  /* ============================================================
     現在地
  ============================================================ */
  function getLocation() {
    if (!navigator.geolocation) { setStatus('位置情報が使えません', 'error'); return; }
    setStatus('位置情報を取得中...', 'loading');
    navigator.geolocation.getCurrentPosition(pos => {
      const lat = pos.coords.latitude, lng = pos.coords.longitude;
      map.setView([lat, lng], 17);
      if (userMarker) map.removeLayer(userMarker);
      userMarker = L.circleMarker([lat, lng], {
        radius: 9, color: '#fff', fillColor: '#f97316', fillOpacity: 1, weight: 3,
      }).addTo(map).bindPopup('現在地');
      setStatus('現在地を取得しました', 'ok');
    }, () => { setStatus('位置情報の取得に失敗しました', 'error'); });
  }

  /* ============================================================
     住所検索
  ============================================================ */
  let sugTimer = null;
  const searchInput = document.getElementById('search-input');
  const sugBox      = document.getElementById('suggestions');

  searchInput.addEventListener('input', () => {
    clearTimeout(sugTimer);
    const q = searchInput.value.trim();
    if (q.length < 2) { hideSug(); return; }
    sugTimer = setTimeout(() => fetchSug(q), 350);
  });
  searchInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { doSearch(); hideSug(); }
    if (e.key === 'Escape') hideSug();
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('.search-wrapper')) hideSug();
  });

  async function fetchSug(q) {
    try {
      const url  = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=5&accept-language=ja&countrycodes=jp`;
      const data = await (await fetch(url, { headers: { 'Accept-Language': 'ja' } })).json();
      if (!data.length) { hideSug(); return; }
      sugBox.innerHTML = data.map(r => {
        const parts = r.display_name.split(',');
        return `<div class="sug-item" data-lat="${r.lat}" data-lng="${r.lon}" data-name="${parts[0].trim()}">
          ${parts[0].trim()}<div class="sug-sub">${parts.slice(1,3).join(', ').trim()}</div>
        </div>`;
      }).join('');
      sugBox.querySelectorAll('.sug-item').forEach(el => {
        el.addEventListener('click', () => {
          searchInput.value = el.dataset.name;
          moveTo(parseFloat(el.dataset.lat), parseFloat(el.dataset.lng), el.dataset.name);
          hideSug();
        });
      });
      sugBox.classList.add('show');
    } catch { hideSug(); }
  }

  function hideSug() { sugBox.classList.remove('show'); }

  async function doSearch() {
    const q = searchInput.value.trim();
    if (!q) return;
    hideSug();
    try {
      const url  = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=1&accept-language=ja&countrycodes=jp`;
      const data = await (await fetch(url, { headers: { 'Accept-Language': 'ja' } })).json();
      if (!data.length) { setStatus('場所が見つかりませんでした', 'error'); return; }
      const r = data[0];
      moveTo(parseFloat(r.lat), parseFloat(r.lon), r.display_name.split(',')[0].trim());
    } catch { setStatus('検索に失敗しました', 'error'); }
  }

  function moveTo(lat, lng, name) {
    map.setView([lat, lng], 17);
    if (searchPin) map.removeLayer(searchPin);
    searchPin = L.marker([lat, lng]).addTo(map).bindPopup(name).openPopup();
  }
  </script>
</body>
</html>
