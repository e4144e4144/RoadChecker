<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>狭路チェッカー</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; font-family: system-ui, 'Noto Sans JP', sans-serif; }
  #map { position: absolute; inset: 0; }

  /* ── TOP BAR ── */
  #topbar {
    position: absolute;
    top: 12px; left: 50%; transform: translateX(-50%);
    z-index: 1000;
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(18,18,18,.9);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,.13);
    border-radius: 40px;
    padding: 7px 12px;
    white-space: nowrap;
    max-width: calc(100vw - 24px);
  }

  /* 現在地ボタン */
  #btn-locate {
    background: #fff;
    color: #111;
    border: none;
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
    transition: opacity .15s;
    flex-shrink: 0;
  }
  #btn-locate:hover { opacity: .82; }
  #btn-locate:disabled { opacity: .4; cursor: default; }

  .vdiv { width:1px; height:22px; background:rgba(255,255,255,.18); flex-shrink:0; }

  /* 検索ボックス */
  #search-wrap {
    position: relative;
    display: flex;
    align-items: center;
    gap: 0;
  }
  #search-input {
    background: rgba(255,255,255,.1);
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 20px 0 0 20px;
    padding: 6px 12px;
    color: #fff;
    font-size: 13px;
    outline: none;
    width: 200px;
    transition: border-color .2s;
  }
  #search-input::placeholder { color: rgba(255,255,255,.4); }
  #search-input:focus { border-color: rgba(255,255,255,.5); }
  #btn-search {
    background: rgba(255,255,255,.15);
    border: 1px solid rgba(255,255,255,.2);
    border-left: none;
    border-radius: 0 20px 20px 0;
    padding: 6px 12px;
    color: #fff;
    cursor: pointer;
    font-size: 13px;
    transition: background .15s;
    display: flex; align-items: center;
  }
  #btn-search:hover { background: rgba(255,255,255,.25); }

  /* 検索候補ドロップダウン */
  #search-results {
    display: none;
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    width: 320px;
    background: rgba(22,22,22,.97);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 10px;
    overflow: hidden;
    z-index: 2000;
    box-shadow: 0 8px 24px rgba(0,0,0,.5);
  }
  #search-results.open { display: block; }
  .sr-item {
    padding: 9px 14px;
    color: #ddd;
    font-size: 12px;
    cursor: pointer;
    border-bottom: 1px solid rgba(255,255,255,.06);
    line-height: 1.4;
  }
  .sr-item:last-child { border-bottom: none; }
  .sr-item:hover { background: rgba(255,255,255,.08); color: #fff; }
  .sr-item b { color: #fff; font-size: 13px; display: block; }

  /* ── LOADING ── */
  #loading {
    position: absolute;
    top: 68px; left: 50%; transform: translateX(-50%);
    z-index: 1000;
    background: rgba(18,18,18,.88);
    backdrop-filter: blur(6px);
    border-radius: 20px;
    padding: 5px 14px;
    color: rgba(255,255,255,.7);
    font-size: 12px;
    display: none;
    align-items: center;
    gap: 7px;
  }
  #loading.show { display: flex; }
  .spin {
    width: 11px; height: 11px;
    border: 2px solid rgba(255,255,255,.25);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .65s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── LEGEND ── */
  #legend {
    position: absolute;
    bottom: 28px; left: 12px;
    z-index: 1000;
    background: rgba(18,18,18,.88);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 10px;
    padding: 11px 15px;
    display: flex;
    flex-direction: column;
    gap: 7px;
    font-size: 12px;
    color: #fff;
  }
  .leg { display: flex; align-items: center; gap: 9px; }
  .sw {
    width: 26px; height: 5px;
    border-radius: 3px;
    flex-shrink: 0;
  }
  .c1 { background: #ff2222; box-shadow: 0 0 5px #ff2222; }
  .c2 { background: #ff8800; box-shadow: 0 0 5px #ff8800; }
  .c3 { background: #ffdd00; box-shadow: 0 0 4px #ffdd00; }
  .c4 { background: #00cc66; }
  .c5 { background: repeating-linear-gradient(90deg,#ff2222 0,#ff2222 5px,transparent 5px,transparent 9px); }

  /* ── POPUP OVERRIDE ── */
  .lpop b   { display: block; font-size: 13px; margin-bottom: 4px; }
  .lpop .row { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; color: #bbb; margin-top: 2px; }
  .lpop .val { color: #fff; font-weight: 600; }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 700;
    margin-bottom: 6px;
  }

  /* ── GPS MSG ── */
  #gps-msg {
    display: none;
    position: absolute;
    top: 68px; left: 50%; transform: translateX(-50%);
    z-index: 1001;
    background: rgba(22,22,22,.95);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 10px;
    padding: 10px 18px;
    color: #fff;
    font-size: 13px;
    font-family: system-ui, sans-serif;
    max-width: 340px;
    text-align: center;
    line-height: 1.6;
    white-space: pre-line;
    box-shadow: 0 6px 20px rgba(0,0,0,.5);
  }
</style>
</head>
<body>

<div id="map"></div>

<div id="topbar">
  <!-- 現在地 -->
  <button id="btn-locate" onclick="getLocation()">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
    </svg>
    現在地
  </button>

  <div class="vdiv"></div>

  <!-- 検索 -->
  <div id="search-wrap">
    <input id="search-input" type="text" placeholder="住所・地名で検索..."
      oninput="onSearchInput()" onkeydown="onSearchKey(event)">
    <button id="btn-search" onclick="doSearch()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
        <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
      </svg>
    </button>
    <div id="search-results"></div>
  </div>
</div>

<div id="loading"><div class="spin"></div>道路データ取得中...</div>

<div id="gps-msg"></div>

<div id="legend">
  <div class="leg"><div class="sw c1"></div><span>3.0m未満　侵入禁止</span></div>
  <div class="leg"><div class="sw c2"></div><span>3.1〜4.0m　徐行必須</span></div>
  <div class="leg"><div class="sw c3"></div><span>4.1〜5.5m　注意</span></div>
  <div class="leg"><div class="sw c4"></div><span>5.5m以上　安心</span></div>
  <div class="leg"><div class="sw c5"></div><span>幅員不明・狭い可能性</span></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ── MAP ─────────────────────────────────────────────────
const map = L.map('map').setView([35.1815, 136.9066], 15);
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution: '© OpenStreetMap © CARTO',
  subdomains: 'abcd',
  maxZoom: 19,
}).addTo(map);

const roadLayer = L.layerGroup().addTo(map);
let fetchTimer, searchTimer, searchMarker;

map.on('moveend', () => {
  clearTimeout(fetchTimer);
  fetchTimer = setTimeout(fetchRoads, 500);
});

// ── 色判定 ──────────────────────────────────────────────
function classify(w) {
  // w: number (meters) or NaN
  if (isNaN(w)) return null;
  if (w < 3.0)  return { color: '#ff2222', label: '侵入禁止',  weight: 5, opacity: .95 };
  if (w <= 4.0) return { color: '#ff8800', label: '徐行必須',  weight: 4, opacity: .9  };
  if (w <= 5.5) return { color: '#ffdd00', label: '注意',      weight: 4, opacity: .85 };
  return              { color: '#00cc66', label: '安心',      weight: 3, opacity: .7  };
}

// ── RENDER ──────────────────────────────────────────────
function render(json) {
  roadLayer.clearLayers();
  const nodes = {};
  json.elements.forEach(el => { if (el.type === 'node') nodes[el.id] = [el.lat, el.lon]; });

  json.elements.forEach(el => {
    if (el.type !== 'way') return;
    const tags = el.tags || {};
    if (!tags.highway) return;

    const pts = (el.nodes || []).map(id => nodes[id]).filter(Boolean);
    if (pts.length < 2) return;

    const w     = parseFloat(tags.width || tags.est_width || 'NaN');
    const hw    = tags.highway;
    const lanes = parseInt(tags.lanes) || null;
    const cls   = classify(w);

    let color, dash, weight, opacity;

    if (cls) {
      color = cls.color; weight = cls.weight; opacity = cls.opacity;
    } else {
      // 幅員データなし — ヒューリスティック
      const narrow = ['service','residential','living_street','track'];
      if (narrow.includes(hw) && lanes === 1) {
        color = '#ff2222'; dash = '8 5'; weight = 3; opacity = .75;
      } else if (narrow.includes(hw)) {
        color = '#ff6644'; dash = '5 5'; weight = 2; opacity = .55;
      } else {
        color = '#666'; weight = 2; opacity = .3;
      }
    }

    const opts = { color, weight, opacity, lineJoin: 'round', lineCap: 'round' };
    if (dash) opts.dashArray = dash;

    // ポップアップ
    const name     = tags.name || tags['name:ja'] || '（名称なし）';
    const widthStr = !isNaN(w) ? `${w} m` : 'データなし';
    const badgeStyle = cls
      ? `background:${cls.color};color:${cls.color==='#ffdd00'?'#333':'#fff'}`
      : 'background:#666;color:#fff';
    const badgeTxt = cls ? cls.label : '幅員不明';

    const popup = `
      <div class="lpop">
        <span class="badge" style="${badgeStyle}">${badgeTxt}</span>
        <b>${name}</b>
        <div class="row"><span>幅員</span><span class="val">${widthStr}</span></div>
        <div class="row"><span>種別</span><span class="val">${hw}</span></div>
        ${tags.lanes ? `<div class="row"><span>車線数</span><span class="val">${tags.lanes}</span></div>` : ''}
        ${tags.maxspeed ? `<div class="row"><span>制限速度</span><span class="val">${tags.maxspeed} km/h</span></div>` : ''}
      </div>`;

    L.polyline(pts, opts).addTo(roadLayer).bindPopup(popup);
  });
}

// ── FETCH ────────────────────────────────────────────────
async function fetchRoads() {
  const b = map.getBounds();
  const q = `[out:json][timeout:25];way["highway"](${b.getSouth().toFixed(5)},${b.getWest().toFixed(5)},${b.getNorth().toFixed(5)},${b.getEast().toFixed(5)});(._;>;);out body;`;
  setLoading(true);
  try {
    const res  = await fetch('https://overpass-api.de/api/interpreter', { method:'POST', body:'data='+encodeURIComponent(q) });
    const json = await res.json();
    render(json);
  } catch(e) { console.error(e); }
  setLoading(false);
}

// ── GEOLOCATION ──────────────────────────────────────────
function getLocation() {
  if (!navigator.geolocation) {
    showMsg('❌ このブラウザはGeolocation非対応です'); return;
  }
  if (location.protocol === 'file:') {
    showMsg('⚠️ ローカルファイル(file://)では位置情報が使えません。\n検索ボックスで場所を入力してください。'); return;
  }
  const btn = document.getElementById('btn-locate');
  btn.disabled = true;
  showMsg('📡 GPS取得中...');
  navigator.geolocation.getCurrentPosition(
    pos => {
      const { latitude: lat, longitude: lng, accuracy } = pos.coords;
      map.setView([lat, lng], 16);
      if (searchMarker) map.removeLayer(searchMarker);
      searchMarker = L.circleMarker([lat, lng], {
        radius: 7, color: '#fff', fillColor: '#4db8ff', fillOpacity: 1, weight: 2
      }).addTo(map).bindPopup('現在地（精度: ±' + Math.round(accuracy) + 'm）').openPopup();
      btn.disabled = false;
      showMsg('✅ 取得完了（精度 ±' + Math.round(accuracy) + 'm）', 3000);
    },
    err => {
      btn.disabled = false;
      const msgs = {
        1: '🔒 位置情報が拒否されています。\nブラウザのアドレスバー横の鍵アイコン\n→「位置情報」を「許可」に変更してください。',
        2: '📡 位置情報を取得できませんでした。\n電波・GPS状況を確認するか\n検索ボックスで場所を入力してください。',
        3: '⏱ タイムアウトしました。\n再度ボタンを押すか\n検索で場所を指定してください。',
      };
      showMsg(msgs[err.code] || '❌ エラー(' + err.code + '): ' + err.message);
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
  );
}

let _msgTimer;
function showMsg(text, autoHideMs) {
  const el = document.getElementById('gps-msg');
  el.textContent = text;
  el.style.display = 'block';
  clearTimeout(_msgTimer);
  if (autoHideMs) _msgTimer = setTimeout(() => { el.style.display = 'none'; }, autoHideMs);
}

// ── ADDRESS SEARCH (Nominatim) ───────────────────────────
let searchResults = [];

function onSearchInput() {
  clearTimeout(searchTimer);
  const q = document.getElementById('search-input').value.trim();
  if (q.length < 2) { closeResults(); return; }
  searchTimer = setTimeout(() => nominatimSuggest(q), 400);
}

function onSearchKey(e) {
  if (e.key === 'Enter') doSearch();
  if (e.key === 'Escape') closeResults();
}

async function nominatimSuggest(q) {
  try {
    const url = `https://nominatim.openstreetmap.org/search?format=json&limit=5&countrycodes=jp&q=${encodeURIComponent(q)}`;
    const res  = await fetch(url, { headers: { 'Accept-Language': 'ja' } });
    const data = await res.json();
    searchResults = data;
    showResults(data);
  } catch(e) { console.error(e); }
}

function showResults(data) {
  const box = document.getElementById('search-results');
  if (!data.length) { box.innerHTML = '<div class="sr-item" style="color:#888">見つかりません</div>'; box.classList.add('open'); return; }
  box.innerHTML = data.map((r,i) => {
    const name = r.display_name.split(',').slice(0,3).join(', ');
    return `<div class="sr-item" onclick="selectResult(${i})"><b>${r.name || r.display_name.split(',')[0]}</b>${name}</div>`;
  }).join('');
  box.classList.add('open');
}

function selectResult(i) {
  const r = searchResults[i];
  if (!r) return;
  const lat = parseFloat(r.lat), lng = parseFloat(r.lon);
  map.setView([lat, lng], 16);
  if (searchMarker) map.removeLayer(searchMarker);
  searchMarker = L.marker([lat, lng]).addTo(map)
    .bindPopup(`<b>${r.name || r.display_name.split(',')[0]}</b>`)
    .openPopup();
  document.getElementById('search-input').value = r.name || r.display_name.split(',')[0];
  closeResults();
}

function doSearch() {
  const q = document.getElementById('search-input').value.trim();
  if (q) nominatimSuggest(q).then(() => { if (searchResults.length) selectResult(0); });
}

function closeResults() {
  document.getElementById('search-results').classList.remove('open');
}

// 検索欄外クリックで候補を閉じる
document.addEventListener('click', e => {
  if (!document.getElementById('search-wrap').contains(e.target)) closeResults();
});

// ── HELPERS ──────────────────────────────────────────────
function setLoading(on) { document.getElementById('loading').classList.toggle('show', on); }

// Popup dark style
const s = document.createElement('style');
s.textContent = `
  .leaflet-popup-content-wrapper { background:#1c1c1c; color:#eee; border-radius:10px; box-shadow:0 6px 20px rgba(0,0,0,.6); padding:0; }
  .leaflet-popup-content { margin:12px 14px; }
  .leaflet-popup-tip { background:#1c1c1c; }
  .leaflet-popup-close-button { color:#777!important; top:8px!important; right:10px!important; }
`;
document.head.appendChild(s);

// Init
fetchRoads();
</script>
</body>
</html>
